<style>
    body {
        background-color: #fce4ec; /* light baby pink */
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }
    .container {
        width: 50%;
        margin: 50px auto;
        text-align: center;
    }
    h1 {
        color: #880e4f; /* dark pink */
    }
    .white-container {
        background-color: #fff; /* white container */
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* add shadow */
    }
    .btn-main {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #880e4f; /* dark pink */
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .upload-btn:hover {
        background-color: #ad1457; /* darker pink on hover */
    }
    #report {
        display: none;
    }
    .file-drop-area {
        border: 2px dashed #880e4f; /* dark pink */
        border-radius: 5px;
        padding: 20px;
        margin-top: 20px;
        color: #880e4f; /* dark pink */
        cursor: pointer;
    }
    .file-drop-area:hover {
        background-color: #fce4ec; /* light baby pink on hover */
    }
</style>
</head>
<body>
<div class="container">
    <h1>Upload your ultrasound report</h1>
</div>
<div class="container">
    <div class="white-container">
        <!-- <form action="http://127.0.0.1:5500/template/pass.html" method="post" enctype="multipart/form-data"> -->
        <form action="/reports" method="post" enctype=multipart/form-data>
            <div class="file-drop-area" id="file-drop-area">
                <span>Drop your files here or</span>
                <!-- <label for="file" class="upload-btn">Select File</label> -->
                <!-- <label for="file" class="btn-main">Select File</label> -->
                <p><label for="file" class="btn-main"><input type=file name=file></label></p>
                <!-- <p><label for="file" class="btn-main">Select File</label></p> -->
                <!-- <input type="file" name="report" id="report" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required> -->
                 <p><input type="file" name="image" id="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="loadFile(event)" style="display:none;" ></p> 
                 <!-- <p><label for="file" style="cursor: pointer;">Upload Image</label></p> -->
                 <p><img id="output" width="200" /></p>
                 <div>
                    <img id="output" src="#" alt="Uploaded Image" style="max-width: 100%;">
                </div>
                 <script>
                    var loadFile = function(event) {
                       var image = document.getElementById('output');
                       image.src = URL.createObjectURL(event.target.files[0]);
                    };
                    </script>
                    <!-- <div>
                        <img id="output" src="#" alt="Uploaded Image" style="max-width: 100%;">
                    </div> -->
                 <!-- <input type=file name=file> -->       
                 <!-- <input type=submit value=Upload> -->
            </div>
            <input type="submit" value=Upload class="btn-main">
        </form>
        <!-- <div id="upload-status"></div> -->
    </div>
</div>
